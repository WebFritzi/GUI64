MEMORY {
    ZP: start = $e0, size = $20, type = rw, file = "";
    RESIDENT: start = $0500, size = $02d0, type = rw, file = "build/krill/loader.bin";
    STATE: start = $64d3, size = $002d, type = rw, file = "";
    GUARD: start = $8200, size = $1e00, type = ro, file = "build/krill/guard.bin";
    ROM: start = $8000, size = $2000, type = ro, file = "build/krill/install-bank.bin";
}
SEGMENTS {
    DISKIO_ZP: load = ZP, type = zp, define = yes;
    DISKIO_INSTALL_ZP: load = ZP, type = zp, define = yes;
    DISKIO: load = RESIDENT, type = rw, define = yes;
    DISKIO_INSTALL_STATE: load = STATE, type = bss, define = yes;
    DISKIO_DRIVECODE: load = ROM, type = ro, define = yes;
    DISKIO_INSTALL: load = ROM, type = ro, define = yes;
    DISKIO_FALLBACK: load = ROM, type = ro, define = yes;
    DISKIO_GUARD: load = GUARD, type = ro, define = yes;
}
